<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      KÖK ADRES ARTIK YÖNLENDİRME SAYFASI.

      NEDEN: burada 713 satırlık ESKİ uygulama duruyordu ve bağlandığı
      Supabase projesi (udrzjlvjkolzqtjtpkgi) 2026 Ağustos'unda silindi.
      Ölçüldü: o adrese istek atınca DNS hiç çözülmüyordu. Yani sayfa
      açılıyor, giriş kutusu çıkıyor, öğrenci kodunu yazıyor ve HİÇBİR
      ŞEY olmuyordu — çalışıyor görünen ama kimsenin giremediği bir kapı.

      15 Eylül'de ~720 öğrenciye adres veriliyor. Sondaki "/yeni/" kısmını
      yazmayı unutan herkes o ölü ekrana düşerdi.

      "Kök index.html hiç değişmeyecek" kuralı Faz 0'dan beri yürürlükteydi
      ve her turda md5'i elle kontrol edildi. Öğretmen ölçümü görüp kuralı
      kaldırdı. Yerine daha güçlüsü geldi: `app/scripts/kok-denetimi.mjs`
      bu dosyanın yönlendirme olarak KALDIĞINI otomatik ölçüyor.

      ESKİ UYGULAMA SİLİNMEDİ: git geçmişinde duruyor.
        git show c2e11dd:index.html > eski-uygulama.html
      Ama açık olalım — veritabanı silindiği için geri getirilse de
      çalışmaz.

      ÜÇ KATMAN, çünkü biri çalışmazsa öbürü devreye girmeli:
        1. meta refresh — JavaScript KAPALIYKEN de çalışır
        2. location.replace — daha hızlı; geçmişe kayıt bırakmadığı için
           geri tuşu sonsuz döngüye girmez
        3. görünür bağlantı — ikisi de engellenirse elle tıklanır

      DIŞARIYA SIFIR İSTEK. Eski sayfa Google Fonts, jsDelivr ve cdnjs
      yüklüyordu; buraya düşen herkesin IP'si üç ayrı üçüncü tarafa
      gidiyordu. Bu sayfa hiçbir dış kaynak yüklemiyor — yazı tipi de yok,
      betik dosyası da. Denetim bunu ayrıca ölçüyor.
    -->
    <meta http-equiv="refresh" content="0; url=/yeni/" />
    <link rel="canonical" href="https://buketmathlab.github.io/yeni/" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#001737" />
    <link rel="icon" href="/yeni/marka/sekiz-favicon.svg" type="image/svg+xml" />

    <title>SEKİZ · Buket Topuzoğlu · Matematik</title>

    <style>
      /* Sistem yazı tipleri — dışarıdan tek dosya inmiyor. Renkler
         SEKİZ'in paletinden (--sk-ink lacivert, --sk-paper krem). */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #fbfaf7;
        color: #001737;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        text-align: center;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 1.5rem;
        padding: 0 1.5rem;
        border-radius: 8px;
        background: #001737;
        color: #fbfaf7;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p><strong>SEKİZ</strong> yeni adresine taşındı.</p>
      <p>Birkaç saniye içinde yönlendirileceksiniz.</p>
      <a href="/yeni/">Giriş ekranına git</a>
    </main>

    <script>
      // `replace` — `href` DEĞİL. `href` geçmişe kayıt bırakır ve
      // kullanıcı geri tuşuna basınca buraya dönüp yeniden yönlendirilir;
      // yani geri tuşu çalışmaz hâle gelir.
      location.replace('/yeni/');
    </script>
  </body>
</html>
