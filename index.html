/* Fotoğraf sıkıştırma → JPEG blob */
function sikistir(file, maxPx=1400, kalite=0.72){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{ const c=document.createElement("canvas");
      const oran = Math.min(1, maxPx/Math.max(img.width, img.height));
      c.width = Math.round(img.width*oran); c.height = Math.round(img.height*oran);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("Fotoğraf işlenemedi")), "image/jpeg", kalite); };
    img.onerror = ()=>rej(new Error("Fotoğraf okunamadı"));
    img.src = URL.createObjectURL(file);
  });
}
async function dosyaYukle(blob, uzanti, tip){
  const ad = crypto.randomUUID() + "." + uzanti;
  const { error } = await sb.storage.from("odevler").upload(ad, blob, { contentType: tip });
  if (error) throw new Error("Dosya yüklenemedi: " + error.message);
  return sb.storage.from("odevler").getPublicUrl(ad).data.publicUrl;
}

/* PDF'ten cevap anahtarı çıkarma */
async function pdfAnahtarOku(file, soruSayisi){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let metin = "";
  for (let i=1; i<=pdf.numPages; i++){
    const sayfa = await pdf.getPage(i);
    const tc = await sayfa.getTextContent();
    metin += tc.items.map(x=>x.str).join(" ") + "\n";
  }
  const anahtar = {};
  const re = /(\d{1,3})\s*[-–.):]?\s*([A-Ea-e])(?![a-zçğıöşü])/g;
  let m;
  while ((m = re.exec(metin)) !== null){
    const no = parseInt(m[1],10);
    if (no>=1 && no<=soruSayisi && !anahtar[no]) anahtar[no] = m[2].toUpperCase();
  }
  return anahtar;
}
function metinAnahtarOku(txt, soruSayisi){
  const anahtar = {};
  const t = txt.trim().toUpperCase();
  const sadeceHarf = t.replace(/[^A-E]/g,"");
  const re = /(\d{1,3})\s*[-–.):]?\s*([A-E])/g; let m; let esli=false;
  while ((m = re.exec(t)) !== null){ esli=true;
    const no=parseInt(m[1],10); if(no>=1&&no<=soruSayisi) anahtar[no]=m[2]; }
  if (!esli && sadeceHarf.length >= soruSayisi){
    for (let i=1;i<=soruSayisi;i++) anahtar[i]=sadeceHarf[i-1];
  }
  return anahtar;
}

async function pdfSecildi(){
  const f=$("oPdf").files[0]; if(!f) return;

    toast(bulunan===n ? `Tüm ${n} cevap bulundu ✓ Kontrol edip onaylayın.` :
      `${bulunan}/${n} cevap bulundu — eksikleri aşağıdan tamamlayın.`, bulunan!==n);

}
window.elleCikar = ()=>{

function onizlemeGoster(n){

  for(let i=1;i<=n;i++){
    h+=`<div class="h"><b>${i}</b><select onchange="yeniAnahtar[${i}]=this.value">

window.odevKaydet = async ()=>{

  hdr(true);
  try{ V = await rpc("veli_paneli",{p_kod:oturum.kod}); }
  catch(e){ if(/bulunamadı/.test(e.message)) return cikis(); return toast(e.message,true); }
  cizVeli();
}
function veliAkis(){
  const ev=[]; const ad=V.ogrenci.ad;
  for(const d of V.odevler){
    ev.push({at:d.created_at, ic:"📘", m:`<b>Yeni ödev:</b> ${esc(d.baslik)} <span class="muted">(son: ${trTarih(d.son_tarih)})</span>`});
    const g=d.gonderim;
    if(g){
      ev.push({at:g.created_at, ic:"✅", m:`<b>${esc(ad)}</b>, "${esc(d.baslik)}" ödevini gönderdi${g.puan!=null?` — <b>${g.puan} puan</b> (${g.dogru} doğru, ${g.yanlis} yanlış)`:""}. 🎉`});
      if(g.durum==="onaylandi") ev.push({at:g.created_at, ic:"🖋️", m:`Öğretmen "${esc(d.baslik)}" ödevini değerlendirdi: <b>${g.ogretmen_puan} puan</b>${g.ogretmen_yorum?` — "${esc(g.ogretmen_yorum)}"`:""}`});
    } else if (gecti(d.son_tarih)){
      ev.push({at:d.son_tarih+"T23:59:59", ic:"⚠️", kirmizi:true, m:`<b>${esc(ad)}</b>, "${esc(d.baslik)}" ödevini son tarihe kadar göndermedi.`});
    }
  }
  for(const m of V.mesajlar.filter(x=>x.kimden==="ogretmen"))
    ev.push({at:m.created_at, ic:"💬", m:`<b>Öğretmenden mesaj:</b> ${esc(m.metin)}`});
  for(const l of (V.dersler||[]))
    ev.push({at:l.created_at||l.zaman, ic:"🎥", m:`<b>Ders planlandı:</b> ${trZaman(l.zaman)}${l.mod==="online"?" (online)":""}`});
  return ev.sort((a,b)=> new Date(b.at)-new Date(a.at));
}
function cizVeli(){
  const o=V.ogrenci;
  const akis = veliAkis();
  const son = V.son_gorulme ? new Date(V.son_gorulme) : new Date(0);
  const okunmamis = akis.filter(e=>new Date(e.at)>son).length;
  const yapildi = V.odevler.filter(d=>d.gonderim).length;
  const eksik = V.odevler.filter(d=>!d.gonderim && gecti(d.son_tarih)).length;
  const T=[["bildirim",`Bildirimler${okunmamis?` (${okunmamis})`:""}`],["odev","Ödevler"],["mesaj","Öğretmenle Mesaj"],
    ...(o.tur==="ozel"?[["odeme","Ödemeler"]]:[])];
  app.innerHTML = `
  <div class="card"><div>Velisi olduğunuz öğrenci: <b>${esc(o.ad)}</b> <span class="tag">${esc(o.sinif)}</span></div>
    <div class="row" style="margin-top:6px;font-size:14px">
      <span style="color:var(--green)"><b>${yapildi}</b> gönderildi</span>
      <span style="color:${eksik?"var(--red)":"var(--muted)"}"><b>${eksik}</b> gönderilmedi</span>
      <span class="muted"><b>${V.odevler.length}</b> toplam ödev</span></div></div>
  <nav class="tabs">${T.map(([k,l])=>`<button class="${vTab===k?"on":""}" onclick="vTabGec('${k}')">${l}</button>`).join("")}</nav>
  <div id="vic"></div>`;
  const ic=$("vic");
  if(vTab==="bildirim"){
    ic.innerHTML = akis.length ? akis.map(e=>`<div class="card ${e.kirmizi?"red":""}"><div class="feed"><div class="ic">${e.ic}</div>
      <div style="font-size:14px">${e.m}<div class="muted" style="margin-top:2px">${trZaman(e.at)}</div></div></div></div>`).join("")
      : `<div class="empty">Henüz bildirim yok. Ödev verildiğinde, gönderildiğinde ya da gönderilmediğinde burada otomatik görünür.</div>`;
    if(okunmamis>0) rpc("okundu_isaretle",{p_kod:oturum.kod}).catch(()=>{});
  }
  if(vTab==="odev"){
    ic.innerHTML = V.odevler.length ? V.odevler.map(d=>{
      const g=d.gonderim; const kirmizi=!g&&gecti(d.son_tarih);
      return `<div class="card ${kirmizi?"red":""}"><div class="between"><div><b>${esc(d.baslik)}</b>
        <div class="muted">Son tarih: ${trTarih(d.son_tarih)}</div></div>
        ${g ? (g.puan!=null?`<span class="tag ok">${g.puan} puan</span>`
             : g.durum==="onaylandi"?`<span class="tag ok">${g.ogretmen_puan} puan</span>`:'<span class="tag warn">Değerlendiriliyor</span>')
           : kirmizi?'<span class="tag bad">Gönderilmedi</span>':'<span class="tag">Bekliyor</span>'}</div></div>`;
    }).join("") : `<div class="empty">Henüz ödev yok.</div>`;
  }
  if(vTab==="mesaj"){
    ic.innerHTML = `<div class="card"><div class="msgbox" id="vListe">${
      V.mesajlar.length ? V.mesajlar.map(m=>`<div class="msg ${m.kimden==="veli"?"ben":"o"}">${esc(m.metin)}<div class="t">${trZaman(m.created_at)}</div></div>`).join("")
      : '<div class="muted" style="text-align:center;padding:20px">Henüz mesaj yok. Öğretmene buradan yazabilirsiniz.</div>'}</div>
      <div class="row"><input id="vMetin" placeholder="Öğretmene mesaj…" style="flex:1;margin:0"><button class="btn" onclick="mesajGonderV()">➤</button></div></div>`;
    const l=$("vListe"); l.scrollTop=l.scrollHeight;
    $("vMetin").addEventListener("keydown",e=>{ if(e.key==="Enter") mesajGonderV(); });
  }
  if(vTab==="odeme"){
    ic.innerHTML = V.odemeler.length ? V.odemeler.map(p=>`<div class="card"><div class="between">
      <span><b>${p.tutar} ₺</b> — ${trTarih(p.tarih)}</span>
      ${p.odendi?'<span class="tag ok">Ödendi</span>':'<span class="tag bad">Bekliyor</span>'}</div></div>`).join("")
      : `<div class="empty">Henüz ödeme kaydı yok.</div>`;
  }
}
window.vTabGec = (k)=>{ vTab=k; cizVeli(); };
window.mesajGonderV = async ()=>{
  const t=$("vMetin").value.trim(); if(!t) return;
  try{ await rpc("mesaj_gonder",{p_kod:oturum.kod,p_metin:t}); await ekranVeli(); vTab="mesaj"; cizVeli(); }
  catch(e){ toast(e.message,true); }
};

/* ================== BAŞLAT ================== */
window.yenile = ()=>{
  if(!oturum) return ekranGiris();
  if(oturum.rol==="ogretmen") return ekranOgretmen();
  if(oturum.rol==="ogrenci") return ekranOgrenci();
  if(oturum.rol==="veli") return ekranVeli();
  ekranGiris();
};
yenile();
</script>
</body>
</html>
