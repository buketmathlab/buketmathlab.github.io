<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001737" />
    <meta
      name="description"
      content="SEKİZ — ödev, teslim ve gelişim tek yerde. Buket Topuzoğlu · Matematik."
    />
    <link rel="icon" href="/yeni/marka/sekiz-favicon.svg" type="image/svg+xml" />

    <!-- Ana ekrana ekleme. `scope` /yeni/ ile sınırlı: kök adresteki eski
         uygulama hiçbir koşulda bu uygulamanın kapsamına girmiyor. -->
    <link rel="manifest" href="/yeni/manifest.webmanifest" />

    <!-- iOS manifest'teki simgeleri KULLANMAZ; ayrı etiket ister. Şeffaf
         PNG'yi de siyah basar, bu yüzden simge zemini dolu üretiliyor. -->
    <link rel="apple-touch-icon" href="/yeni/marka/sekiz-simge-180.png" />
    <!-- Ana ekranda görünecek ad. Tam ad ("SEKİZ · Buket Topuzoğlu ·
         Matematik") simgenin altında kırpılırdı. -->
    <meta name="apple-mobile-web-app-title" content="SEKİZ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`: durum çubuğu kendi zeminini korur. `black-translucent`
         içeriği çentiğin altına sokardı. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>SEKİZ · Buket Topuzoğlu · Matematik</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      SEKİZ'i kullanmak için tarayıcınızda JavaScript'in açık olması gerekiyor.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
